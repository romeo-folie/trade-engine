# TradeEngine configuration example.
# Copy to ~/.tradeengine/config.yaml and fill in your values.
# Fields ending in _env reference environment variable names — set those vars in your shell.

engine:
  mode: paper                  # manual | auto | paper | orb-options | forex | orb-futures | orb-futures-metals | orb-newyork
  tick_interval_sec: 3600      # Analysis interval (seconds). 3600=1h recommended for daily-candle strategy; 300=5min for intraday
  max_watchlist: 50            # Maximum concurrent watchlist items
  dry_run: false               # If true, no orders placed regardless of mode
  initial_capital: 100000      # Starting cash for paper trading / position sizing
  log_timezone: UTC            # IANA timezone for engine log timestamps (e.g. America/New_York)
  skip_recent_tick: true       # Skip the startup tick when the last analysis is newer than tick_interval_sec
  adopt_broker_orphans: false  # Startup reconciler inserts recovery trade rows for untracked broker positions (stops anchored on current price); false = drift is alert-only

# ── Model configuration ───────────────────────────────────────────────────────
# Use the registry+roles block (recommended) to name models and reference them
# by role. This allows the engine to apply fallbacks, cost profiles, and adaptive
# depth without hard-coding provider/model pairs throughout config.
models:
  registry:
    analyst_cheap:
      provider: deepseek
      model: deepseek-chat
      api_key_env: DEEPSEEK_API_KEY     # export DEEPSEEK_API_KEY=sk-...
      max_tokens: 2048
      temperature: 0.1
      timeout_sec: 60
    # analyst_cheap (OpenAI alternative):
    #   provider: openai
    #   model: gpt-4o
    #   api_key_env: OPENAI_API_KEY
    analyst_mid:
      provider: google
      model: gemini-2.5-flash
      api_key_env: GEMINI_API_KEY       # export GEMINI_API_KEY=... (aistudio.google.com)
      max_tokens: 2048
      temperature: 0.1
      timeout_sec: 60
      # gemini-2.5-flash counts "thinking" tokens inside maxOutputTokens. Without
      # a dedicated budget, a long thinking phase starves the JSON answer and
      # truncates it mid-string. thinking_budget gives thinking its own allowance;
      # the client then requests maxOutputTokens = max_tokens + thinking_budget so
      # the answer can never be crowded out. Omit/0 leaves the model's native
      # default (no override); -1 requests dynamic thinking.
      thinking_budget: 1024
      fallback: gemini_flash            # fallback registry key on 429/503
    gemini_flash:
      provider: google
      model: gemini-2.5-flash-lite
      api_key_env: GEMINI_API_KEY
      max_tokens: 2048
      temperature: 0.1
      timeout_sec: 60
    analyst_frontier:
      provider: anthropic
      model: claude-sonnet-4-6
      api_key_env: ANTHROPIC_API_KEY    # export ANTHROPIC_API_KEY=sk-ant-...
      max_tokens: 2048
      temperature: 0.1
      timeout_sec: 60
    arbiter:
      provider: anthropic
      model: claude-haiku-4-5
      api_key_env: ANTHROPIC_API_KEY
      max_tokens: 4096
      temperature: 0.1
      timeout_sec: 90
    classifier:
      provider: google
      model: gemini-2.5-flash-lite
      api_key_env: GEMINI_API_KEY
      max_tokens: 256
      temperature: 0.0
      timeout_sec: 15
    # classifier (alternatives):
    #   provider: deepseek / model: deepseek-chat / api_key_env: DEEPSEEK_API_KEY
    #   provider: openai   / model: gpt-4o-mini   / api_key_env: OPENAI_API_KEY
    news_enricher:
      provider: google
      model: gemini-2.5-flash-lite
      api_key_env: GEMINI_API_KEY
      max_tokens: 2048
      temperature: 0.1
      timeout_sec: 60
      # Per-model outbound request pacing to stay under the provider's per-model
      # quota (honoured by google only today; 0 = provider default, 10 RPM).
      # Limiters are PER CLIENT INSTANCE: if two roles share one model their
      # rates are additive — use different models or lower each RPM (PR #358).
      requests_per_minute: 10
    # news_enricher (alternatives):
    #   provider: deepseek / model: deepseek-chat / api_key_env: DEEPSEEK_API_KEY
    #   provider: openai   / model: gpt-4o-mini   / api_key_env: OPENAI_API_KEY
    embedder:
      provider: ollama
      model: nomic-embed-text
      timeout_sec: 30
    # OpenAI reasoning-model example (gpt-5 / o-series). Not referenced by any
    # role below — swap it into models.roles to activate. Shown live so the
    # reasoning knobs stay documented and machine-checked.
    analyst_reasoning_example:
      provider: openai
      model: gpt-5-mini
      api_key_env: OPENAI_API_KEY
      max_tokens: 4096
      temperature: 0.1
      timeout_sec: 90
      # Hidden reasoning tokens count inside max_completion_tokens — unbounded
      # reasoning can return an empty answer. gpt-5: minimal|low|medium|high;
      # o1/o3/o4: low|medium|high; gpt-5-pro: high only. Unset → client default
      # "low" (omitted entirely for gpt-5-pro). Ignored by other providers (PR #356).
      reasoning_effort: low

  roles:
    analysts: [analyst_cheap, analyst_mid, analyst_frontier]
    arbiter: arbiter
    classifier: classifier
    news_enricher: news_enricher
    embedder: embedder

  consensus:
    enabled: true
    fast_path_confidence: 0.68   # All analysts must meet this min confidence to fast-path
    fast_path_max_spread: 0.15   # Max confidence spread across analysts to fast-path

  # ── Legacy single-model / inline-ensemble mode ────────────────────────────
  # If you have not migrated to registry+roles, you can still use the old format.
  # Remove the registry/roles blocks above and uncomment one of these instead.
  #
  # Single model (cheapest):
  # primary:
  #   provider: anthropic
  #   model: claude-sonnet-4-6
  #   api_key_env: ANTHROPIC_API_KEY
  #   max_tokens: 4096
  #   temperature: 0.1
  #   timeout_sec: 60
  # consensus:
  #   enabled: false
  #
  # Inline ensemble (pre-registry style):
  # analysts:
  #   - provider: anthropic
  #     model: claude-sonnet-4-6
  #     api_key_env: ANTHROPIC_API_KEY
  #     max_tokens: 4096
  #     temperature: 0.1
  #     timeout_sec: 60
  #   - provider: openai
  #     model: gpt-4o
  #     api_key_env: OPENAI_API_KEY
  #     max_tokens: 4096
  #     temperature: 0.1
  #     timeout_sec: 60
  #   - provider: google
  #     model: gemini-2.0-flash
  #     api_key_env: GEMINI_API_KEY
  #     max_tokens: 4096
  #     temperature: 0.1
  #     timeout_sec: 60
  # arbiter:
  #   provider: anthropic
  #   model: claude-opus-4-6
  #   api_key_env: ANTHROPIC_API_KEY
  #   max_tokens: 4096
  #   temperature: 0.1
  #   timeout_sec: 90

markets:
  stocks:
    enabled: true
    paper: true                # true = paper-api.alpaca.markets; false = api.alpaca.markets
    # Optional: fail preflight if the configured credentials select another account.
    # Use separate paper/live credentials through the env vars on each deployment.
    expected_account_number: ""
    api_key_env: ALPACA_API_KEY
    secret_env: ALPACA_API_SECRET
    base_url: https://paper-api.alpaca.markets
    data_url: https://data.alpaca.markets
    option_feed: indicative     # options chain feed: "opra" (real-time, needs Algo Trader Plus) | "indicative" (free, 15-min delayed). options-ORB requires opra.

  # IBKR Client Portal gateway — used by the ORB forex/futures strategies.
  ibkr:
    enabled: false
    account_id: ""
    gateway_url: "https://localhost:5000"
    tickle_sec: 240                # Keep-alive ping interval (seconds)
    insecure_tls: true             # Gateway uses a self-signed cert on localhost
    auth_monitor_sec: 60           # Poll /auth/status every N seconds while running
    auth_alert_debounce_min: 30    # Min minutes between repeated auth-flap alerts

  # OANDA v20 — data-only source for the ORB backtest engine (`te backtest orb`).
  # A free practice (demo) account needs no funding; on a non-US OANDA entity it
  # serves metals (XAU/USD, XAG/USD) alongside spot forex. Never used for live trading.
  oanda:
    enabled: false
    token_env: OANDA_API_TOKEN   # env var holding your v20 API token
    account_id: ""               # only needed for live quotes, not for candles
    practice: true               # true → api-fxpractice.oanda.com (free demo)
    base_url: ""                 # optional API override; empty uses the practice/live default

  # ORB backtest data source: "histdata" (default; free bulk tick ZIPs, no account),
  # "dukascopy" (per-hour .bi5 feed; superseded by histdata but still supported),
  # "exness" (local MetaTrader OHLC exports; data-only, not the execution venue), or
  # "oanda" (v20 candles; needs the free practice-account token above — the ONLY
  # thing markets.oanda is used for; nothing touches OANDA unless selected here).
  backtest_provider: histdata
  histdata:
    base_url: ""                 # optional site override (default histdata.com)
    cache_dir: ""                # optional on-disk cache dir (default ~/.tradeengine/histdata)
  exness:
    data_dir: "data"             # yearly SYMBOL_M1_YEAR_exness.csv or consolidated SYMBOL_M1_START_END.csv exports
  # Corrupt-bar rejection (issue #519). Providers occasionally serve a bad
  # aggregate: on 2026-08-04 Alpaca returned an ANET 1h bar at high 224.98 while
  # the same session's daily high was 194.30 and the last trade was 190.53. That
  # bar feeds ATR and the trailing high-water mark, so under trailing_stop.rule
  # "atr" it would place a resting stop ABOVE the real market and close a healthy
  # position at market on fabricated data.
  #
  # Structural validation (finite, positive, high>=low, high/low enclose the
  # body) ALWAYS runs on every timeframe and is not configurable — such bars are
  # unambiguously corrupt.
  #
  # The keys below tune the INTRADAY range check, which rejects a bar whose own
  # high-low span is implausibly wide for the recent tape. It measures the bar's
  # own width rather than its distance from the prior close, because real
  # overnight gaps move further than the corrupt bar did (VOYG opened +30.6% on
  # 2026-08-04 vs the corrupt bar's 18.2%) — a gap shifts the level without
  # widening the bar. Daily bars are exempt entirely: their move distribution is
  # too heavy-tailed to threshold (p99.9 = 110%), and gating them rejected real
  # catalyst sessions such as ANET's -24% DeepSeek crash.
  candle_sanity:
    enabled: true                    # intraday range check on/off (structural checks always run). Unset = true
    max_range_ratio: 15.0            # bar's own span as a multiple of the window's MEDIAN range (median, not mean: a mean is dragged up by the outlier being hunted). Widest legitimate intraday bar measured 10.13x; the corrupt bar was ~17.4x
    max_range_pct: 10.0              # that span as % of prior close; BOTH this and the ratio must be exceeded to reject
    scale_window: 20                 # prior bars forming the median-range scale
    max_consecutive_rejections: 3    # a run this long is treated as a real re-rating and RESTORED, so a genuine level shift is never discarded
  dukascopy:
    base_url: ""                 # optional feed override (default datafeed.dukascopy.com)
    cache_dir: ""                # optional on-disk cache dir (default ~/.tradeengine/dukascopy)
    point_scale: {}              # per-symbol price scale overrides, e.g. {"XAU/USD": 1000}. Index CFDs (…IDXUSD) default ÷1000.
    fetch_concurrency: 0         # in-flight hour fetches (0 = default 6); lower to 1 if a cold cache-fill run drowns in 503s
    min_request_interval_ms: 0   # global spacing between request starts (0 = none); 3000-5000 + fetch_concurrency 1 for a throttled cold IP. Only taxes the first fill — cached hours never re-fetch.

  news:
    provider: finnhub             # finnhub | benzinga
    api_key_env: FINNHUB_API_KEY
    fetch_every_min: 15           # Fetch news every N minutes per ticker

    # Knowledge extraction controls (cost/rate guardrails)
    extraction_enabled: true
    extraction_provider: google    # use a single provider for extraction path; supported: anthropic | openai | deepseek | google | ollama
    extraction_model: gemini-2.5-flash-lite # must exist in configured model clients; no cross-provider fallback
    # extraction_provider: deepseek / extraction_model: deepseek-chat  (alternative)
    # extraction_provider: openai   / extraction_model: gpt-4o         (alternative)
    extraction_max_articles_per_tick: 10
    extraction_rpm: 20             # global extraction requests/minute cap

strategies:
  trend_following:
    enabled: true
    ema_period: 20
    adx_min: 25
    rsi_min: 45
    rsi_max: 65
  mean_reversion:
    enabled: true
    bb_period: 20
    bb_std_dev: 2.0
    rsi_oversold: 30
    rsi_overbought: 70
  momentum:
    enabled: true
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    volume_multiple: 1.5
  news_sentiment:
    enabled: false
    min_sentiment: 0.6
    max_age_hours: 48
risk:
  confidence_threshold: 0.72   # Static floor used when confidence_tiers is empty
  # Tiered confidence by R:R (#317): the first tier whose rr_min is <= the
  # trade's R:R applies. Declare tiers in descending rr_min order.
  # An empty/omitted list falls back to confidence_threshold only.
  confidence_tiers:
    - rr_min: 2.0
      conf_min: 0.70
    - rr_min: 1.5
      conf_min: 0.72
  min_risk_reward: 1.5         # Minimum R:R ratio required
  max_position_pct: 20.0       # Max % of portfolio per position
  max_open_positions: 10
  max_per_ticker: 2            # Cap open positions per ticker (same direction); 0 disables (#312)
  max_dollar_risk_pct: 0.5     # Hard cap on per-trade $-at-risk (qty × |entry − stop|) as % of equity; 0 disables (#320)
  pyramid_enabled: true        # Allow BUY on existing long up >= pyramid_min_gain_pct (#324)
  pyramid_min_gain_pct: 2.5    # Minimum unrealised gain (%) on the open long for a pyramid add (#324)
  daily_loss_limit_pct: 2.0    # Pause engine if daily loss exceeds this
  max_drawdown_pct: 10.0       # Emergency stop if drawdown exceeds this
  cooldown_after_loss_min: 15  # Minutes to pause trading after a losing trade
  default_stop_loss_pct: 2.0
  default_take_profit_pct: 4.0
  signal_expiry_min: 120       # Discard pending signals older than this
  stale_price_move_pct: 2.0    # Cancel signal if price moved >X% since generation
  trailing_stop:               # Server-side trailing stop manager (#322)
    enabled: true
    rule: atr                  # atr = hourly broker-stop ratchet; ema9 = exit on daily close below daily 9-EMA
    atr_multiple: 1.5          # new_stop = hwm - atr_multiple * ATR (absolute-price ATR)
    interval_sec: 60           # Recompute cadence
    atr_period: 14             # Wilder ATR lookback in 1h candles
    activate_at_gain_pct: 5.0  # Withhold the trail until PEAK gain from entry hits this % (0 = trail from the first tick).
                               # Latches on the high-water mark, so once earned the trail stays on through a pullback.
                               # Below it the original protective stop owns the exit. rule "atr" only.
  uncap_take_profit: true      # With trailing_stop enabled, omit fixed TP and let the selected trail own winning exits
  exit_conf_min: 0.72          # Minimum analyst SELL confidence to close a long; 0 preserves current behavior
  bracket_exits_enabled: false # Stock BUYs require whole-share GTC broker brackets: TP/SL fire intrabar; sub-share or invalid protection is rejected (#541). Default off.
  # Evidence-driven entry-quality gates. All default off and BUY-only. Legacy
  # filters fail open on missing evidence; pullback is an additive setup path.
  entry_gates:
    trend_alignment_enabled: false  # Block BUYs when price is below declining daily EMA9 + EMA21 (#472)
    pullback_strength_enabled: false  # Add the complete momentum → consolidation → AVWAP flush/reclaim setup path
    pullback_min_momentum_return_pct: 30  # Minimum return on at least one of the 1/3/6-month horizons
    pullback_consolidation_sessions: 40  # Eight trading weeks of higher-low, narrowing structure
    pullback_support_tolerance_pct: 1.5  # AVWAP stacking/touch tolerance around EMA9 or horizontal support
    pullback_max_stop_width_pct: 4.0  # Maximum entry-to-low-of-day risk; the session low becomes the stop
    news_min_runup_pct: 0      # news_sentiment BUY needs price >= this % above prior close (tape confirms headline); 0 disables. Recommended 2.0
    momentum_max_runup_pct: 0  # momentum BUY blocked when already > this % above prior close (anti-chase); 0 disables. Recommended 2.0
    first_tick_defer: false    # Hold first-session-tick BUYs pending; execute next tick only if price held (breaks the overnight-headline burst)
    first_tick_hold_tolerance_pct: 1.0  # How far below signal price still counts as "held"

# ── Analysis gate (cost-reduction Epics 1 & 2) ───────────────────────────────
# Controls the pre-LLM material-change gate (zero token cost) and the optional
# two-stage classifier and adaptive ensemble depth scorer.
analysis:
  material_change_only: true         # Skip LLM call if nothing significant changed
  hold_cooldown_min: 120             # Don't re-analyze a HOLD ticker for N minutes
  rsi_delta_threshold: 3.0          # Min RSI change to count as material
  ema_gap_delta_pct: 0.5            # Min EMA-gap change (%) to count as material
  price_move_threshold_pct: 0.75    # Min price move (%) to count as material
  news_novelty_enabled: true        # Treat new unseen news as always material
  max_news_articles_per_prompt: 5   # Cap news items injected into the LLM prompt
  max_candles_per_prompt: 20        # Cap OHLCV candles injected into the LLM prompt
  history_window_by_strategy:       # Per-strategy lookback (candles)
    trend_following: 20
    mean_reversion: 20
    momentum: 14

  # Classifier: two-stage gate that can block an analysis call before any
  # expensive model is invoked.
  # mode: disabled — always proceed to analysis
  #        shadow   — log what would have been skipped, but never block (safe for tuning)
  #        active   — enforce skips; llm_fallback_enabled adds a cheap LLM second opinion
  classifier:
    mode: shadow
    rsi_delta_threshold: 3.0
    ema_gap_delta_pct: 0.5
    price_move_threshold_pct: 0.75
    hold_cooldown_min: 120
    news_novelty_enabled: true
    llm_fallback_enabled: false      # If true, a SKIP from rules is confirmed by LLM
    llm_fallback_model: classifier   # Role name (from models.roles) for the LLM fallback — not a direct registry key

  # Sequential specialist analysis.
  # When enabled, the engine routes signal-generation calls to
  # Analyzer.AnalyzeSpecialist instead of AnalyzeFull. Fundamental, technical,
  # and sentiment prompts run in parallel. Their completed findings then pass
  # through a mandatory risk_manager review before deterministic risk controls.
  # AnalyzeFull itself is unchanged. DEFAULT OFF. Opt in only after verifying
  # provider keys for every mapped role.
  specialist_mode_enabled: false
  # Map each specialist role to a key declared in models.registry above.
  # The mapping below is illustrative — operators should swap in whichever
  # provider+model they want behind each role. All four mappings and providers
  # are required; specialist analysis fails closed when one is unavailable.
  specialist_roles:
    fundamental: analyst_frontier   # frontier model for catalysts/earnings reasoning
    technical: analyst_mid          # mid-tier for indicator/structure analysis
    sentiment: analyst_cheap        # cheap model for high-volume news/social pass
    risk_manager: analyst_frontier  # frontier model for portfolio/veto decisions

  # Adaptive depth: scores each tick and routes to fewer analysts when the
  # situation is low-volatility / low-novelty. Requires analyst tier roles
  # (analyst_cheap, analyst_mid, analyst_frontier) in models.registry.
  adaptive_depth:
    enabled: false                   # Opt-in; disable to always use all analysts
    low_threshold: 0.30              # Score < low → cheapest analyst only, no arbiter
    high_threshold: 0.65             # Score ≥ high → all analysts, standard rules
    weights:
      volatility: 0.30              # ATR% contribution
      news_novelty: 0.25            # News novelty contribution
      risk_proximity: 0.25          # Distance to stop/drawdown contribution
      trend_strength: 0.20          # ADX normalised contribution

  # Multi-timeframe borderline arbiter (Issue #321): when a WAIT lands in the
  # borderline confidence band, re-run the ensemble on the mapped alternate
  # timeframe and re-arbitrate across both views. Narrow band by design — only
  # a small fraction of WAITs incur the 2× token cost.
  multi_timeframe_borderline_enabled: true
  multi_timeframe_borderline_conf_min: 0.55  # Band lower bound (below = plain WAIT)
  multi_timeframe_borderline_conf_max: 0.70  # Band upper bound (above = plain WAIT)
  multi_timeframe_alt_map:                   # primary timeframe → alternate to consult
    1h: 4h
    4h: 1h
    1d: 1h

# ── Cost profiles & budget guardrails (cost-reduction Epic 3) ────────────────
# profile sets a named preset for tick_interval, hold_cooldown, classifier mode,
# adaptive_depth, and cache TTL. Explicit values in this file always override the
# profile. Unknown profiles are rejected at startup.
#   budget   — 90-min ticks, classifier active, adaptive_depth off, 3h cache TTL
#   balanced — 60-min ticks, classifier active, adaptive_depth on, 2h cache TTL
#   pro      — 60-min ticks, classifier active, adaptive_depth on, 1h cache TTL
cost:
  profile: balanced
  daily_token_budget: 200000        # Auto-degrade profile if crossed (tokens/day)
  weekly_token_budget: 1200000      # Auto-degrade profile if crossed (tokens/week)
  auto_degrade_on_budget_hit: true  # Step down profile tier on budget breach
  # cache_ttl_min is owned by the cost profile (budget=180, balanced=120, pro=60).
  # Uncomment to override the profile-driven default with an explicit value.
  # cache_ttl_min: 120

notifications:
  telegram:
    enabled: false
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id: ""                # Your Telegram chat ID
    notify_on:
      - signal
      - trade
      - error
      - daily_summary
    # Batching (Epic 1): accumulate events per tick and flush a single summary.
    # Error events always bypass the batcher and are sent immediately.
    batch_enabled: true
    batch_window_sec: 60          # Flush after N seconds of accumulation
    max_items_per_batch: 25       # Hard cap per flush
    include_holds: false          # Include HOLD signals in batch summary
    min_confidence_for_alert: 0.65  # Suppress signals below this confidence

logging:
  level: info                  # debug | info | warn | error
  format: text                 # text | json
  max_size_mb: 50              # rotate engine.log when it reaches this size
  max_backups: 7               # number of rotated log files to keep
  max_age_days: 30             # delete rotated log files older than this
  compress: true               # gzip rotated log files

database:
  url_env: DATABASE_URL        # export DATABASE_URL=postgres://...

reports:
  output_dir: ~/.tradeengine/reports
  auto_open_browser: true

backtest:
  initial_cash: 100000         # Starting virtual portfolio value for backtests
  risk_free_rate: 0.04         # Annual risk-free rate used for Sharpe/Sortino/Calmar

embeddings:
  enabled: false
  # Local-first setup (no embedding API usage): ollama + nomic-embed-text.
  # Note: nomic-embed-text is 768-dim, so if you enable this provider you must
  # use a 768-dim vector schema (or migrate from 1536 before enabling).
  provider: ollama             # ollama | openai
  dimension: 768               # Must match DB vector dimension
  model: nomic-embed-text      # Required when provider=ollama
  ollama_base_url: http://localhost:11434
  api_key_env: OPENAI_API_KEY  # Used only when provider=openai
  worker_interval_sec: 30
  batch_size: 50
  similar_analyses_enabled: false
  similar_analyses_threshold: 0.8
  similar_analyses_limit: 3

# ── Forex/metals strategies (IBKR) — run with `te run --mode forex` ──────────
forex_orb:
  enabled: false
  instruments:
    - symbol: EUR/USD
      sec_type: CASH
      min_lot_size: 20000
      pip_buffer: 0.0002
      strategy: orb             # orb (default dual-sided breakout) | trend_continuation | sweep_reclaim | opening_shock
      range_minutes: 0          # Per-instrument range override; 0 inherits forex_orb.range_minutes
      side_mode: both           # both | long | short for single-entry strategies
      max_hold_minutes: 240   # flatten a filled trade after 4h (0 = inherit strategy default below)
      # Entry-quality filters (Phase 2). All default 0 = off. range_atr_ratio =
      # opening_range_width / ATR(atr_period, atr_timeframe). Skip a session whose
      # ratio falls outside [min, max], or whose spread/risk exceeds max_spread_to_risk.
      min_range_atr: 0.25
      max_range_atr: 0.90
      max_spread_to_risk: 0.08
      # Close-position guard (Phase 2): arm only the side price leaned toward as the range
      # locked. close_frac = (last_close - low) / (high - low) at lock (0 = low, 1 = high).
      # Buy kept only when close_frac >= threshold, sell only when <= 1 - threshold; a
      # mid-range close (dead zone) skips the session as directionless. 0 = off. 0.55–0.70.
      close_frac_threshold: 0
      # Breakout confirmation (Phase 3): "" / stop_touch (default, fills on a touch),
      # close_1m (one 1-min close beyond), close_3m (3 consecutive closes beyond,
      # filters false breakouts), or retest_swing / retest_range (Phase 6: wait for
      # the pullback to retest the breakout level, enter on the bounce — stop at the
      # retest swing or the opposite range edge respectively). Confirmation enters
      # later and at a worse price in exchange for a stronger signal.
      breakout_confirmation: close_1m
      risk_reward: 0            # Per-instrument override when > 0; 0 inherits forex_orb.risk_reward
      # Trend-continuation knobs (used only when strategy: trend_continuation). The model
      # waits after the opening range, requires consecutive closes beyond the range, then
      # enters at market in the retained direction. Range filters are in pip_buffer units;
      # exclude bands are half-open [min,max), e.g. "32:60".
      continuation_delay_minutes: 0
      continuation_confirm_bars: 0
      continuation_depth_mult: 0
      continuation_trend_filter: none
      continuation_trend_lookback_minutes: 0
      continuation_min_range_pips: 0
      continuation_max_range_pips: 0
      continuation_exclude_range_pips: ""
      continuation_monthly_stop_loss: 0
      # Sweep/reclaim knobs (used only when strategy: sweep_reclaim).
      sweep_reclaim_level_set: overnight
      sweep_reclaim_depth_mult: 0
      sweep_reclaim_entry_window_minutes: 0
      # Opening-shock knobs (used only when strategy: opening_shock).
      opening_shock_window_minutes: 0
      opening_shock_lookback: 0
      opening_shock_percentile: 0
      opening_shock_stop_mult: 0
      opening_shock_entry_delay_minutes: 0
      # Retest knobs (retest_* modes only): how close the pullback must return to
      # the breakout level (fraction of opening-range width) and how long after the
      # breakout the bounce entry may occur. 0 = engine defaults.
      retest_tolerance: 0
      retest_timeout_minutes: 0
      # Direction eligibility (Phase 3): only place the trend-aligned side (price vs the
      # trend-timeframe EMA) instead of blind dual-sided. Default false.
      direction_eligibility: true
      # Per-instrument risk multiplier (Phase 5): scale this instrument's risk vs the
      # strategy max_risk_pct (e.g. 0.35 sizes XAU/USD down). <=0 → 1.0.
      risk_multiplier: 0.35
      # Margin-aware sizing: broker margin requirement as a fraction of notional
      # (0.033 ≈ 30:1 forex leverage, 0.05 gold CFD). When set, max_position_pct caps
      # MARGIN CONSUMED (notional × margin_rate) instead of full notional — without it a
      # leveraged FX position caps near min-lot, where the broker's minimum commission
      # is 13-27% of the dollar risk per trade (sweep 9af76e63). <=0 → full notional.
      margin_rate: 0.033
      # Hard USD cap on order value (entry × qty) applied after all other sizing.
      # For high-margin_rate metals CFDs whose sizing overshoots the broker's
      # precautionary order-value limit (IBKR default $100k → endless confirmation
      # prompts; PR #387 uses 95000 for XAU/XAG). USD-quoted symbols only —
      # Validate rejects it elsewhere. <=0 disables (default).
      max_notional_usd: 0
      # Dollar value of a 1.0 price-point move per unit/contract. Forex/CFD units are
      # $1/point — leave 0 (the default). Set only for exchange-listed futures mapped
      # onto this struct (tick_value / tick_size: MES 5, MNQ 2, MYM 0.5); scales dollar
      # risk, notional caps and backtest P&L. The futures backtest CLI sets it itself.
      point_value: 0
      # Minimum price increment. 0 (forex/CFD default) = prices not tick-snapped. Futures
      # set it (from the contract's tick_size) so bracket levels land on tradeable ticks.
      tick_size: 0
      # Commission/dollar-risk gate: estimated commission per fill and the max round-trip
      # commission as a fraction of planned dollar risk. Use commission_per_side for flat
      # dollar estimates, or commission_bps_per_side + commission_min_per_side for bps
      # products such as IBKR London metals. 0 disables; a max without either commission
      # estimate fails config validation. These fields also feed the backtest cost model.
      commission_per_side: 6.0
      commission_bps_per_side: 0
      commission_min_per_side: 0
      max_commission_to_risk: 0.05
      # Adaptive exit management (Phase 4), measured by the backtest `adaptive` variant
      # (live order-management lands in a follow-up). R = |entry_stop − stop_loss|.
      break_even_r: 0.8           # move the stop to entry after +0.8R
      trail_atr_mult: 1.5         # trail at high-water-mark − 1.5×ATR (ratchet up)
      trail_after_r: 1.0          # start trailing only after +1.0R
      partial_take_profit_r: 1.0  # take a partial at +1.0R
      partial_fraction: 0.5       # close half the position at the partial
      runner_take_profit_r: 2.0   # runner's target after the partial
    - symbol: GBP/USD
      sec_type: CASH
      min_lot_size: 20000
      pip_buffer: 0.0002
      max_hold_minutes: 180
    - symbol: XAU/USD
      sec_type: CFD
      min_lot_size: 1
      pip_buffer: 0.50
      max_hold_minutes: 90
      commission_bps_per_side: 1.5
      commission_min_per_side: 2.0
      max_commission_to_risk: 0.05
    - symbol: XAG/USD
      sec_type: CFD
      min_lot_size: 50
      pip_buffer: 0.01
      max_hold_minutes: 90
      commission_bps_per_side: 3.0
      commission_min_per_side: 2.0
      max_commission_to_risk: 0.05
  session: london
  timezone: UTC
  range_minutes: 15
  risk_reward: 2.0
  max_risk_pct: 1.0
  max_position_pct: 10.0
  # Strategy-level fallback time limit for any instrument that doesn't set its own
  # max_hold_minutes. At expiry the bracket legs are cancelled and the position is
  # flattened at market (exit_type='time_exit'). 0 disables time exits. Prevents
  # the multi-day holds that caused most ORB losses.
  max_hold_minutes: 240
  # ATR used by the range-quality filter (range_atr_ratio). Hourly ATR against which a
  # 15-30 min opening range yields ratios in the 0.25-1.25 band.
  atr_period: 14
  atr_timeframe: 1h
  # EMA used by the direction-eligibility trend filter.
  trend_timeframe: 1h
  trend_ema_period: 20
  # When true, record an entry fill from broker truth (positions) if
  # GetOrderStatus can't confirm it — the metals blind spot where a bracket
  # fills at IBKR but the parent order id ages out of the orders/trades
  # endpoints, leaving the row 'pending' and the position unmanaged. Marks the
  # matching pending entry filled and cancels the opposing OCO leg. Opt-in: it
  # mutates real-money order/trade state from position inference.
  reconcile_orphan_fills: false

# ── FX currency-strength rotation (IBKR data/execution) ──────────────────────
# Research setup from Exness M1 data, traded via IBKR only after live controls
# are wired. Separate from forex_orb: this ranks a currency basket into the
# London session, trades strongest-vs-weakest only when breadth confirms, then
# exits at a fixed time instead of using ORB brackets.
currency_strength:
  enabled: false
  mode: shadow                 # shadow | paper; live is rejected until execution controls exist
  rank_instruments:
    - EUR/USD
    - GBP/USD
    - USD/JPY
    - EUR/JPY
    - GBP/JPY
  trade_instruments:
    - GBP/USD
    - USD/JPY
  timezone: UTC
  strength_start: "06:00"
  strength_end: "09:00"
  exit_time: "18:00"
  min_gap: 0.005
  broad_min: 2
  confirm_min_move: 0.0015
  units: 100000

# ── US equity-index futures ORB (IBKR) — run with `te run --mode orb-newyork` ─
futures_orb:
  enabled: false
  session_open_et: "09:30"     # US equity index futures open with the equity market
  range_minutes: 15
  risk_reward: 2.0
  max_risk_pct: 0.5            # Per-trade risk as % of portfolio (the real risk control)
  max_position_pct: 20.0       # With margin_rate set this caps MARGIN consumed (notional × margin_rate) ≈ $20k budget on $100k — NOT full notional
  max_hold_minutes: 0          # Strategy-level default time exit (0 = off unless a contract sets its own). Mirrors forex_orb.
  # ATR (range-quality filter) and trend EMA (direction eligibility) settings — the same
  # filters forex_orb uses, available once futures route through the shared gated path.
  atr_period: 14
  atr_timeframe: "1h"
  trend_timeframe: "1h"
  trend_ema_period: 20
  # Micro E-mini index futures (1/10th of the full-size contract). Micros are used so a
  # small/paper account can hold ≥1 contract — a full-size ES (~$280k notional) sizes to
  # zero under the position cap. margin_rate makes max_position_pct cap margin not notional
  # (same lever as forex_orb); ~0.10 is a conservative overnight-margin ESTIMATE, refine
  # against IBKR. Swap in ES/NQ/YM/RTY (tick_value 12.50/5.00/5.00/5.00, no margin_rate or a
  # smaller one) for a full-size account. Quarterly expiry (Mar/Jun/Sep/Dec).
  #
  # Per-contract strategy fields (all default 0/"" = off) make a futures contract carry the
  # same config a forex instrument does, so it routes through the shared strategy path.
  # strategy: orb | trend_continuation | sweep_reclaim | opening_shock.
  # side_mode: both | long | short for single-entry strategy families.
  # The MES/MNQ/MYM examples below are the 2022-2026 Exness-proxy research candidates.
  # Keep futures_orb.enabled=false until deliberately paper/shadow piloting through IBKR.
  instruments:
    - symbol: MES
      exchange: CME
      asset_class: equity_index
      expiry_cycle: quarterly
      tick_size: 0.25
      tick_value: 1.25
      tick_buffer: 2
      margin_rate: 0.10
      strategy: trend_continuation
      side_mode: short
      range_minutes: 30             # Use futures_orb.range_minutes=30 when arming MES.
      risk_reward: 3.0
      max_hold_minutes: 240
      continuation_delay_minutes: 15
      continuation_confirm_bars: 3
      continuation_depth_mult: 2.0
      continuation_trend_filter: none
      continuation_trend_lookback_minutes: 0
      continuation_min_range_pips: 0
      continuation_max_range_pips: 0
      continuation_exclude_range_pips: ""
      continuation_monthly_stop_loss: 0
      commission_per_side: 0.85
      risk_multiplier: 1.0
    - symbol: MNQ
      exchange: CME
      asset_class: equity_index
      expiry_cycle: quarterly
      tick_size: 0.25
      tick_value: 0.50
      tick_buffer: 2
      margin_rate: 0.10
      strategy: opening_shock
      range_minutes: 1              # shock logic has its own 30m window; do not delay scheduler execution.
      side_mode: long
      max_hold_minutes: 60
      risk_reward: 2.5
      opening_shock_window_minutes: 30
      opening_shock_lookback: 40
      opening_shock_percentile: 70
      opening_shock_stop_mult: 1.0
      opening_shock_entry_delay_minutes: 5
      min_range_atr: 0.0           # range-quality band (0 = that bound off)
      max_range_atr: 0.0
      max_spread_to_risk: 0.0      # skip if spread / |entry−stop| exceeds this (0 = off)
      # "" | stop_touch | close_1m | close_3m are live now; retest_swing / retest_range are
      # backtest-only until the live retest path lands (the scheduler skips a retest-configured
      # instrument until then). retest_range is the strongest walk-forward MNQ config — the
      # upgrade target once retest goes live.
      breakout_confirmation: close_3m
      retest_tolerance: 0.25       # retest_* only: pullback within this fraction of range width
      retest_timeout_minutes: 30   # retest_* only: bounce must occur within N minutes of breakout
      direction_eligibility: false # true = trade only the trend-aligned side
      commission_per_side: 0.85    # $/contract/side; also feeds the backtest cost model + commission gate
      max_commission_to_risk: 0.0  # skip if round-trip commission / dollar-risk exceeds this (0 = off)
      risk_multiplier: 1.0         # scale this contract's per-trade risk (<=0 → 1.0)
      max_notional_usd: 0.0        # cap order value (entry × qty × point_value) after sizing (0 = off)
      break_even_r: 0.0            # adaptive exits (0 = fixed bracket)
      trail_atr_mult: 0.0
      trail_after_r: 0.0
      partial_take_profit_r: 0.0
      partial_fraction: 0.0
      runner_take_profit_r: 0.0
    - symbol: MYM
      exchange: CBOT
      asset_class: equity_index
      expiry_cycle: quarterly
      tick_size: 1.00
      tick_value: 0.50
      tick_buffer: 4
      margin_rate: 0.10
      strategy: sweep_reclaim
      range_minutes: 1              # reclaim watches from the open and does not depend on ORB width.
      side_mode: both
      risk_reward: 3.0
      max_hold_minutes: 180
      sweep_reclaim_level_set: overnight
      sweep_reclaim_depth_mult: 8.0
      sweep_reclaim_entry_window_minutes: 240
      commission_per_side: 0.85
    - { symbol: M2K, exchange: CME,  asset_class: equity_index, expiry_cycle: quarterly, tick_size: 0.10, tick_value: 0.50, tick_buffer: 4, margin_rate: 0.10 }

# ── Options-ORB (Alpaca) — run the ORB signal but execute via long equity options ─────
# Executes on the equities/newyork session. Long-only (buy calls on long breakouts,
# puts on shorts) so max loss = premium. The configured `underlyings` are FORCE-WATCHED
# every day — they get their own opening range and a DUAL-SIDED breakout entry (call vs
# put chosen by which side of the range breaks first, first breakout only, entry window =
# open+60m). This mirrors the options-ORB backtest
# (`te backtest orb-options`) exactly, so live behaviour matches the validated strategy.
#
# REQUIRES the Alpaca real-time OPRA options feed (markets.stocks.option_feed: opra) +
# Level 2 options approval. TWO DAILY PREREQUISITES or the gates fail CLOSED (zero trades):
#   1. `te options backfill-iv`  — seeds option_iv_history for the IV-rank gate.
#   2. `te earnings sync`        — populates earnings_calendar for any SINGLE-NAME underlying
#                                  (ETFs are earnings-exempt). te-switch runs both before launch.
# Default-off. The values below are the paper-pilot config validated on 2024-H2..2025
# (SPY/IWM/NVDA positive per-trade across independent periods, robust to strike band and a
# pessimistic spread) — an in-sample edge; forward paper is the real out-of-sample test.
options_orb:
  enabled: false
  underlyings: [SPY, IWM, NVDA]  # fixed options-mode symbols; no direct-equity ORB path exists
  etf_underlyings: [SPY, IWM]    # earnings-exempt. Single names (NVDA) hit the earnings gate and
                                 # fail closed unless `te earnings sync` has populated their dates.
  premium_budget: 1000          # $ of option premium to deploy per trade (validated sizing)
  max_loss_per_trade: 1000      # hard cap on premium at risk (== max loss for a long option)
  range_minutes: 15             # opening range window: 5 or 15 minutes
  risk_reward: 2.0              # underlying target risk/reward (>= 1.5)
  iv_rank_ceiling: 70           # abort if the underlying's IV rank ≥ this (avoid IV crush)
  max_dte: 5                    # keep contracts with 0 < DTE ≤ this (nearest weekly)
  delta_min: 0.50               # near-ATM band lower bound (|delta|)
  delta_max: 0.60               # near-ATM band upper bound
  spread_pct_ceiling: 5         # abort if the contract's bid-ask spread % ≥ this (slippage)
  earnings_blackout_days: 3     # single names only; skip within this many days of earnings
  time_exit_minutes: 0          # IV-crush time exit in minutes; 0 = OFF. The validated strategy holds
                                # to stop/target/EOD-flatten — the 30-min time exit was OVERFIT (OOS ≈$0).
  iv_lookback_days: 252         # IV-Rank trailing window (~1 year)
  iv_min_samples: 40            # fail closed below this many stored IV days (cold-start guard)

# ── COMEX metals futures ORB (IBKR) — run with `te run --mode orb-metals` ─────
futures_orb_metals:
  enabled: false
  session_open_et: "08:20"     # COMEX pit open (US/Eastern)
  range_minutes: 15
  risk_reward: 2.0
  max_risk_pct: 1.0
  max_position_pct: 30.0
  max_hold_minutes: 0          # strategy-level default time exit (0 = off)
  atr_period: 14               # ATR (range-quality filter) / trend EMA (direction eligibility) — shared gated path
  atr_timeframe: "1h"
  trend_timeframe: "1h"
  trend_ema_period: 20
  # margin_rate (optional): caps max_position_pct on margin consumed instead of full
  # notional — full-size GC is ~$200k notional, so omit it only on a large account.
  # Per-contract strategy fields (all default 0/"" = off) work identically to futures_orb —
  # see that section's MNQ entry for the full documented set. GC shows them here minimally.
  instruments:                 # Monthly expiry
    - symbol: GC
      exchange: COMEX
      asset_class: metal
      expiry_cycle: monthly
      tick_size: 0.10
      tick_value: 10.00
      tick_buffer: 3
      margin_rate: 0.10
      strategy: orb
      range_minutes: 0
      side_mode: both
      risk_reward: 0.0
      max_hold_minutes: 0
      min_range_atr: 0.0
      max_range_atr: 0.0
      max_spread_to_risk: 0.0
      breakout_confirmation: ""
      continuation_delay_minutes: 0
      continuation_confirm_bars: 0
      continuation_depth_mult: 0.0
      continuation_trend_filter: none
      continuation_trend_lookback_minutes: 0
      continuation_min_range_pips: 0
      continuation_max_range_pips: 0
      continuation_exclude_range_pips: ""
      continuation_monthly_stop_loss: 0
      sweep_reclaim_level_set: overnight
      sweep_reclaim_depth_mult: 0.0
      sweep_reclaim_entry_window_minutes: 0
      opening_shock_window_minutes: 0
      opening_shock_lookback: 0
      opening_shock_percentile: 0
      opening_shock_stop_mult: 0.0
      opening_shock_entry_delay_minutes: 0
      retest_tolerance: 0.0
      retest_timeout_minutes: 0
      direction_eligibility: false
      commission_per_side: 0.0
      max_commission_to_risk: 0.0
      risk_multiplier: 1.0
      max_notional_usd: 0.0
      break_even_r: 0.0
      trail_atr_mult: 0.0
      trail_after_r: 0.0
      partial_take_profit_r: 0.0
      partial_fraction: 0.0
      runner_take_profit_r: 0.0
    - { symbol: SI, exchange: COMEX, asset_class: metal, expiry_cycle: monthly, tick_size: 0.005, tick_value: 25.00, tick_buffer: 5, margin_rate: 0.10 }

# ── Market scanner — autonomous candidate discovery ───────────────────────────
# Runs during market hours, sourcing candidates from screeners (top movers,
# most active), the knowledge graph, and news-sympathy triggers. Every candidate
# passes the same LLM conviction gate before joining the watchlist with a TTL.
scanner:
  enabled: false
  scan_interval_hours: 2       # Scan cadence during market hours (9:30–16:00 ET)
  candidate_cap: 10            # Max scanner-sourced items on the watchlist at once
  ttl_days: 3                  # Auto-expire scanner picks after N days without a signal
  min_conviction: 0.65         # Min LLM conviction to add — discovery gate, not trade approval
  news_lookback_hours: 24      # News window when enriching candidates before scoring
  top_movers: 20               # Top gainers+losers fetched per scan
  top_actives: 20              # Most-active-by-volume fetched per scan
  max_promotions_per_industry: 0 # Optional per-industry promotion cap; 0 disables
  promotion_correlation_enabled: false # Additive exposure/correlation selector; off preserves legacy behavior
  promotion_max_abs_correlation: 0.85    # Absolute daily-return Pearson ceiling
  promotion_correlation_lookback_days: 60
  promotion_correlation_min_overlap: 30
  universe:
    enabled: false                         # Full-market point-in-time universe; off preserves movers/actives-only discovery
    after_close_delay_minutes: 30          # Build after the official close; dependants wait for approval
    run_lease_minutes: 120                 # Reclaim a build if its owner disappears beyond this lease
    min_market_data_coverage: 0.90         # Reject plausible-looking snapshots with incomplete provider evidence
    provider: alpaca                       # Provider adapter used for bulk membership and eligibility evidence
    min_price: 5.0                         # Exclude lower-priced securities once the universe is enabled
    min_market_cap_mm: 100.0               # Minimum market cap in USD millions
    min_median_dollar_volume: 1000000.0    # Minimum median daily dollar volume over the lookback
    dollar_volume_lookback_days: 20        # Completed sessions used for median dollar volume
    allowed_security_types: [us_equity]     # Alpaca's reliable asset class; narrower types require a richer asset-master provider
    allowed_exchanges: [NYSE, NASDAQ, AMEX]
    excluded_name_patterns: ['(?i)\bwarrants?\b', '(?i)\brights?\b', '(?i)\bunits?(?:\s*(?:[,(]|$))', '(?i)\bnotes?\s+due\b', '(?i)\betns?\b', '(?i)\bdebentures?\b', '(?i)\bpreferred\s+(?:stock|shares?)(?:,\s*series\b.*)?\s*$', '(?i)\bpreference\s+shares?(?:,\s*series\b.*)?\s*$'] # Exclude non-common instruments while retaining ETFs/common stock
    max_spread_bps: 0.0                    # Maximum quoted spread in basis points; 0 disables this ceiling
    require_active: true                   # Fail closed when the provider marks a security inactive
    require_tradable: true                 # Fail closed when the broker marks a security untradable
    require_market_data: true              # Require sufficient price/liquidity evidence
    snapshot_ttl_hours: 24                 # Maximum age for reusing a complete universe snapshot
    taxonomy_max_age_hours: 168            # Stale/unknown taxonomy cannot qualify an industry signal
    batch_size: 200                        # Maximum symbols requested per provider batch
    max_concurrency: 4                     # Maximum concurrent provider batches
    taxonomy_refresh_limit: 200            # Maximum stale classifications refreshed per update
    missing_fundamentals_policy: exclude   # exclude = fail closed; include = retain with missing evidence recorded
    missing_market_data_policy: exclude    # exclude = fail closed; include = retain with missing evidence recorded
  weekly_leader:
    enabled: false                         # Full-universe after-close leadership lens; default off
    promote_candidates: false              # When true, qualified leaders enter the normal LLM/watchlist gate
    max_promotions_per_run: 20             # Bound qualified names sent through the paid LLM gate
    after_close_delay_minutes: 15          # Minimum delay; shared universe delay must be at least this long
    universe_max_age_hours: 36             # Maximum age of the completed point-in-time universe
    history_calendar_days: 420             # Fetch window supporting 253 sessions plus weekends, holidays, and buffer
    min_history_sessions: 253              # True 52-week history; shorter-history names fail explicitly
    benchmark: SPY                         # Market-relative-strength benchmark
    industry_min_peers: 5                  # Minimum known/fresh peers for industry-relative strength
    selection_percentile: 0.90             # Cross-sectional leader cutoff
    min_composite_score: 0.70              # Absolute quality floor in addition to the percentile cutoff
    min_feature_coverage: 0.90              # Missing components never silently become neutral scores
    batch_size: 200                        # Maximum symbols requested per daily-bars provider batch
    run_lease_minutes: 60                  # Reclaim stale run or candidate-promotion claims after this lease
    ttl_days: 10                            # Slower weekly evidence remains available longer than intraday picks
  potent_industry:
    enabled: false                         # Full-universe industry-rotation lens; default off
    promote_candidates: false              # Add top members to normal scanner scoring; keep false for observation only
    max_promotions_per_run: 20             # Global promotion cap; excluded from scoring-history compatibility
    after_close_delay_minutes: 15          # Minimum delay; shared universe delay must be at least this long
    universe_max_age_hours: 36             # Maximum age of the immutable universe snapshot
    taxonomy_max_age_hours: 168            # Maximum age of taxonomy used to form a group
    history_calendar_days: 420             # Calendar fetch window supporting true 52-week diagnostics
    min_history_sessions: 253              # Minimum completed sessions per evaluated member
    market_benchmark: SPY                  # Market-relative return benchmark
    sector_benchmarks:                     # Exact immutable sector labels only; no fuzzy remapping
      Communication Services: XLC
      Consumer Discretionary: XLY
      Consumer Staples: XLP
      Energy: XLE
      Financials: XLF
      Health Care: XLV
      Industrials: XLI
      Materials: XLB
      Real Estate: XLRE
      Technology: XLK
      Utilities: XLU
    industry_benchmark_overrides: {}       # Optional exact industry label → tradeable benchmark symbol
    min_fresh_taxonomy_coverage: 1.0       # Fail closed unless every grouped member has fresh taxonomy
    min_group_members: 5                   # Minimum point-in-time constituents for an industry evaluation
    min_group_coverage: 0.80               # Successfully evaluated members / eligible group members
    min_potency_score: 0.70                # Absolute deterministic group-quality floor
    min_member_score: 0.65                 # Absolute member-quality floor before top-N selection
    selection_percentile: 0.80             # Cross-sectional potency percentile floor
    min_advance_share: 0.60                # Minimum fraction of advancing constituents
    min_median_return_5d: 0.0              # Broad group median must not be negative by default
    max_cap_equal_divergence: 0.08         # Prevent one large constituent masking weak equal-weight breadth
    min_persistence_sessions: 3            # Required qualifying sessions among the last five
    max_members_per_group: 3               # Deterministic member-selection cap for each qualified group
    batch_size: 200                        # Maximum symbols per historical-bars provider request
    run_lease_minutes: 60                  # Reclaim failed or expired scheduled-run claims
    ttl_days: 5                             # Industry rotation candidates retain a multi-session horizon
  premarket_episodic:
    enabled: false                         # Pre-open episodic-gap observations; default off
    promote_candidates: false              # Qualified gaps enter the normal LLM/watchlist gate only
    checkpoints: ["08:00", "09:00", "09:20"] # America/New_York; exchange calendar and DST aware
    hard_cutoff: "09:25"                   # No result may publish after opening-range preparation begins
    feed: sip                              # Consolidated executable evidence; IEX is rejected
    universe_max_age_hours: 36             # Deprecated compatibility field; freshness is exact prior-session based
    history_sessions: 20                   # Same-clock premarket volume sessions used by RVOL
    news_lookback_hours: 24                # Catalyst freshness window ending at the checkpoint
    max_candidates_per_run: 50             # Detailed-evidence shortlist cap
    max_promotions_per_run: 10             # Paid LLM/watchlist funnel cap
    min_gap_pct: 3.0                       # Absolute premarket gap from completed prior close
    min_premarket_volume: 100000            # Consolidated shares through the checkpoint
    min_time_adjusted_rvol: 2.0            # Same-clock volume / historical same-clock median
    min_dollar_volume: 1000000.0           # Premarket shares × last price
    min_trade_count: 500                   # Consolidated prints through the checkpoint
    max_spread_bps: 50.0                   # Executable consolidated bid/ask ceiling
    max_quote_age_seconds: 120             # Staler quotes fail closed
    min_bar_coverage: 0.80                 # Expected premarket-minute coverage
    min_price: 5.0                         # Lower-price risk floor
    min_market_cap_mm: 100.0               # Market-cap risk floor in USD millions
    batch_size: 200                        # Maximum symbols per snapshot request
    run_lease_minutes: 15                  # Reclaim a crashed checkpoint worker
  graph_neighbors:
    enabled: false             # Source candidates from knowledge-graph neighbors of manually-watched tickers
    max_per_scan: 5            # Cap graph candidates per scan so they don't crowd out screener picks
    min_confidence: 0.80       # Min extractor confidence for an auto edge (seed/confirmed edges bypass)
    min_corroboration: 2       # Min distinct news items asserting an auto edge (seed/confirmed bypass)
    min_edge_strength: 0.6     # Min edge strength (0–1) to consider a neighbor
  news_sympathy:
    enabled: false             # News-triggered sympathy: fresh sentiment-strong news on a watched ticker fans out to its graph neighbors (edge eligibility reuses graph_neighbors thresholds)
    lookback_hours: 6          # How fresh the triggering article must be — spillover edge decays in hours
    min_abs_sentiment: 0.35    # Min |sentiment_score| for an article to trigger fan-out
    max_per_scan: 5            # Cap sympathy candidates per scan
    pair_cooldown_hours: 24    # Don't re-surface the same (seed, neighbor) pair within this window

# ── Feedback pipeline — nightly performance review → prompt enrichment ────────
feedback:
  enabled: false
  review_time_utc: "18:00"
  windows: [1, 7, 30]          # Rolling review windows (days)
  prompt_enrichment: true      # Inject per-ticker performance context into stock prompts
  thresholds:
    model_win_rate_min: 0.40
    model_min_trades: 20
    instrument_win_rate_min: 0.35
    instrument_min_trades: 10
    arbiter_invoked_rate_max: 0.50
  # ORB auto-throttle: derive a per-instrument risk multiplier from rolling
  # realised expectancy — sizes a losing instrument down, a winner up, within
  # [floor, cap]. Disabled (or below min_trades) leaves sizing exactly as-is.
  orb_auto_throttle:
    enabled: false
    window: "30d"              # Feedback window to learn from
    min_trades: 20             # Below this trade count → neutral 1.0
    sensitivity: 1.0           # Multiplier change per 1 pct-point of avg PnL
    floor: 0.5                 # Minimum multiplier
    cap: 1.5                   # Maximum multiplier
    max_age_days: 3            # Ignore a stored multiplier older than this

# ── Portfolio data plumbing — broker polling + web cache TTLs ─────────────────
portfolio:
  poller:
    enabled: true
    interval_sec: 60             # Broker account/positions poll cadence
    significant_change_pct: 0.05 # Publish an update only when equity moves this much
  cache:
    account_ttl_sec: 3           # Web API cache TTLs for broker-backed endpoints
    positions_ttl_sec: 3
    history_ttl_sec: 30
    orders_ttl_sec: 10
