# TradeEngine configuration example.
# Copy to ~/.tradeengine/config.yaml and fill in your values.
# Fields ending in _env reference environment variable names — set those vars in your shell.

engine:
  mode: paper                  # manual | auto | paper
  tick_interval_sec: 300       # Analysis interval (seconds). Default: 300 (5 min)
  max_watchlist: 50            # Maximum concurrent watchlist items
  dry_run: false               # If true, no orders placed regardless of mode

models:
  primary:
    provider: anthropic
    model: claude-sonnet-4-5
    api_key_env: ANTHROPIC_API_KEY    # export ANTHROPIC_API_KEY=sk-ant-...
    max_tokens: 4096
    temperature: 0.1
    timeout_sec: 60
  secondary: []                # Add additional models for consensus
  consensus:
    enabled: false
    strategy: majority         # majority | unanimous | primary-with-veto

markets:
  stocks:
    enabled: true
    paper: true                # Paper trading on Alpaca sandbox
    api_key_env: ALPACA_API_KEY
    secret_env: ALPACA_API_SECRET
    base_url: https://paper-api.alpaca.markets
    data_url: https://data.alpaca.markets
  predictions:
    enabled: false
    platforms:
      polymarket:
        enabled: false
        api_key_env: POLYMARKET_API_KEY
        categories: [politics, crypto]
        min_volume: 50000
        max_contracts: 20
      kalshi:
        enabled: false
        api_key_env: KALSHI_API_KEY
        categories: [politics]
        min_volume: 10000
        max_contracts: 10

  news:
    provider: finnhub             # finnhub | benzinga
    api_key_env: FINNHUB_API_KEY
    fetch_every_min: 15           # Fetch news every N minutes per ticker

strategies:
  trend_following:
    enabled: true
    ema_period: 20
    adx_min: 25
    rsi_min: 45
    rsi_max: 65
  mean_reversion:
    enabled: true
    bb_period: 20
    bb_std_dev: 2.0
    rsi_oversold: 30
    rsi_overbought: 70
  momentum:
    enabled: true
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    volume_multiple: 1.5
  news_sentiment:
    enabled: false
    min_sentiment: 0.6
    max_age_hours: 48
  prediction_mispricing:
    enabled: false
    min_edge: 0.05
    min_volume: 50000

risk:
  confidence_threshold: 0.65   # Minimum LLM confidence to generate a signal
  min_risk_reward: 1.5         # Minimum R:R ratio required
  max_position_pct: 5.0        # Max % of portfolio per position
  max_open_positions: 10
  daily_loss_limit_pct: 3.0    # Pause engine if daily loss exceeds this
  max_drawdown_pct: 15.0       # Emergency stop if drawdown exceeds this
  cooldown_after_loss_min: 60  # Minutes to pause trading after a losing trade
  default_stop_loss_pct: 2.0
  default_take_profit_pct: 4.0
  signal_expiry_min: 30        # Discard pending signals older than this
  stale_price_move_pct: 2.0    # Cancel signal if price moved >X% since generation

notifications:
  telegram:
    enabled: false
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id: ""                # Your Telegram chat ID
    notify_on:
      - signal
      - trade
      - error
      - daily_summary

logging:
  level: info                  # debug | info | warn | error
  format: text                 # text | json

database:
  url_env: DATABASE_URL        # export DATABASE_URL=postgres://...

reports:
  output_dir: ~/.tradeengine/reports
  auto_open_browser: true
