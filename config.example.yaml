# TradeEngine configuration example.
# Copy to ~/.tradeengine/config.yaml and fill in your values.
# Fields ending in _env reference environment variable names — set those vars in your shell.

engine:
  mode: paper                  # manual | auto | paper
  tick_interval_sec: 3600      # Analysis interval (seconds). 3600=1h recommended for daily-candle strategy; 300=5min for intraday
  max_watchlist: 50            # Maximum concurrent watchlist items
  dry_run: false               # If true, no orders placed regardless of mode
  initial_capital: 100000      # Starting cash for paper trading / position sizing

# ── Model configuration ───────────────────────────────────────────────────────
# Use the registry+roles block (recommended) to name models and reference them
# by role. This allows the engine to apply fallbacks, cost profiles, and adaptive
# depth without hard-coding provider/model pairs throughout config.
models:
  registry:
    analyst_cheap:
      provider: deepseek
      model: deepseek-chat
      api_key_env: DEEPSEEK_API_KEY     # export DEEPSEEK_API_KEY=sk-...
      max_tokens: 2048
      temperature: 0.1
      timeout_sec: 60
    # analyst_cheap (OpenAI alternative):
    #   provider: openai
    #   model: gpt-4o
    #   api_key_env: OPENAI_API_KEY
    analyst_mid:
      provider: google
      model: gemini-2.5-flash
      api_key_env: GEMINI_API_KEY       # export GEMINI_API_KEY=... (aistudio.google.com)
      max_tokens: 2048
      temperature: 0.1
      timeout_sec: 60
      # gemini-2.5-flash counts "thinking" tokens inside maxOutputTokens. Without
      # a dedicated budget, a long thinking phase starves the JSON answer and
      # truncates it mid-string. thinking_budget gives thinking its own allowance;
      # the client then requests maxOutputTokens = max_tokens + thinking_budget so
      # the answer can never be crowded out. Omit/0 leaves the model's native
      # default (no override); -1 requests dynamic thinking.
      thinking_budget: 1024
      fallback: gemini_flash            # fallback registry key on 429/503
    gemini_flash:
      provider: google
      model: gemini-2.5-flash-lite
      api_key_env: GEMINI_API_KEY
      max_tokens: 2048
      temperature: 0.1
      timeout_sec: 60
    analyst_frontier:
      provider: anthropic
      model: claude-sonnet-4-6
      api_key_env: ANTHROPIC_API_KEY    # export ANTHROPIC_API_KEY=sk-ant-...
      max_tokens: 2048
      temperature: 0.1
      timeout_sec: 60
    arbiter:
      provider: anthropic
      model: claude-sonnet-4-6
      api_key_env: ANTHROPIC_API_KEY
      max_tokens: 4096
      temperature: 0.1
      timeout_sec: 90
    classifier:
      provider: google
      model: gemini-2.5-flash-lite
      api_key_env: GEMINI_API_KEY
      max_tokens: 256
      temperature: 0.0
      timeout_sec: 15
    # classifier (alternatives):
    #   provider: deepseek / model: deepseek-chat / api_key_env: DEEPSEEK_API_KEY
    #   provider: openai   / model: gpt-4o-mini   / api_key_env: OPENAI_API_KEY
    news_enricher:
      provider: google
      model: gemini-2.5-flash-lite
      api_key_env: GEMINI_API_KEY
      max_tokens: 2048
      temperature: 0.1
      timeout_sec: 60
    # news_enricher (alternatives):
    #   provider: deepseek / model: deepseek-chat / api_key_env: DEEPSEEK_API_KEY
    #   provider: openai   / model: gpt-4o-mini   / api_key_env: OPENAI_API_KEY
    embedder:
      provider: ollama
      model: nomic-embed-text
      timeout_sec: 30

  roles:
    analysts: [analyst_cheap, analyst_mid, analyst_frontier]
    arbiter: arbiter
    classifier: classifier
    news_enricher: news_enricher
    embedder: embedder

  consensus:
    enabled: true
    fast_path_confidence: 0.68   # All analysts must meet this min confidence to fast-path
    fast_path_max_spread: 0.15   # Max confidence spread across analysts to fast-path

  # ── Legacy single-model / inline-ensemble mode ────────────────────────────
  # If you have not migrated to registry+roles, you can still use the old format.
  # Remove the registry/roles blocks above and uncomment one of these instead.
  #
  # Single model (cheapest):
  # primary:
  #   provider: anthropic
  #   model: claude-sonnet-4-6
  #   api_key_env: ANTHROPIC_API_KEY
  #   max_tokens: 4096
  #   temperature: 0.1
  #   timeout_sec: 60
  # consensus:
  #   enabled: false
  #
  # Inline ensemble (pre-registry style):
  # analysts:
  #   - provider: anthropic
  #     model: claude-sonnet-4-6
  #     api_key_env: ANTHROPIC_API_KEY
  #     max_tokens: 4096
  #     temperature: 0.1
  #     timeout_sec: 60
  #   - provider: openai
  #     model: gpt-4o
  #     api_key_env: OPENAI_API_KEY
  #     max_tokens: 4096
  #     temperature: 0.1
  #     timeout_sec: 60
  #   - provider: google
  #     model: gemini-2.0-flash
  #     api_key_env: GEMINI_API_KEY
  #     max_tokens: 4096
  #     temperature: 0.1
  #     timeout_sec: 60
  # arbiter:
  #   provider: anthropic
  #   model: claude-opus-4-6
  #   api_key_env: ANTHROPIC_API_KEY
  #   max_tokens: 4096
  #   temperature: 0.1
  #   timeout_sec: 90

markets:
  stocks:
    enabled: true
    paper: true                # Paper trading on Alpaca sandbox
    api_key_env: ALPACA_API_KEY
    secret_env: ALPACA_API_SECRET
    base_url: https://paper-api.alpaca.markets
    data_url: https://data.alpaca.markets

  # ibkr:
  #   enabled: false
  #   account_id: ""
  #   gateway_url: "https://localhost:5000"
  #   tickle_sec: 240
  #   insecure_tls: true

  # OANDA v20 — data-only source for the ORB backtest engine (`te backtest orb`).
  # A free practice (demo) account needs no funding; on a non-US OANDA entity it
  # serves metals (XAU/USD, XAG/USD) alongside spot forex. Never used for live trading.
  # oanda:
  #   enabled: true
  #   token_env: OANDA_API_TOKEN   # env var holding your v20 API token
  #   account_id: ""               # only needed for live quotes, not for candles
  #   practice: true               # true → api-fxpractice.oanda.com (free demo)

  news:
    provider: finnhub             # finnhub | benzinga
    api_key_env: FINNHUB_API_KEY
    fetch_every_min: 15           # Fetch news every N minutes per ticker

    # Knowledge extraction controls (cost/rate guardrails)
    extraction_enabled: true
    extraction_provider: google    # use a single provider for extraction path; supported: anthropic | openai | deepseek | google | ollama
    extraction_model: gemini-2.5-flash-lite # must exist in configured model clients; no cross-provider fallback
    # extraction_provider: deepseek / extraction_model: deepseek-chat  (alternative)
    # extraction_provider: openai   / extraction_model: gpt-4o         (alternative)
    extraction_max_articles_per_tick: 10
    extraction_rpm: 20             # global extraction requests/minute cap

strategies:
  trend_following:
    enabled: true
    ema_period: 20
    adx_min: 25
    rsi_min: 45
    rsi_max: 65
  mean_reversion:
    enabled: true
    bb_period: 20
    bb_std_dev: 2.0
    rsi_oversold: 30
    rsi_overbought: 70
  momentum:
    enabled: true
    macd_fast: 12
    macd_slow: 26
    macd_signal: 9
    volume_multiple: 1.5
  news_sentiment:
    enabled: false
    min_sentiment: 0.6
    max_age_hours: 48
risk:
  confidence_threshold: 0.55   # Static floor used when confidence_tiers is empty
  # Tiered confidence by R:R (#317): the first tier whose rr_min is <= the
  # trade's R:R applies. Declare tiers in descending rr_min order.
  # An empty/omitted list falls back to confidence_threshold only.
  confidence_tiers:
    - rr_min: 2.0
      conf_min: 0.52
    - rr_min: 1.4
      conf_min: 0.58
    - rr_min: 1.1
      conf_min: 0.62
  min_risk_reward: 1.2         # Minimum R:R ratio required (#317: 1.5 → 1.4 → 1.2 in feat/reduce-wait-bias)
  max_position_pct: 5.0        # Max % of portfolio per position
  max_open_positions: 20
  max_per_ticker: 4            # Cap open positions per ticker (same direction); 0 disables (#312)
  max_dollar_risk_pct: 1.0     # Hard cap on per-trade $-at-risk (qty × |entry − stop|) as % of equity; 0 disables (#320)
  pyramid_enabled: false       # Allow BUY on existing long up >= pyramid_min_gain_pct (#324). Default off — safe rollout.
  pyramid_min_gain_pct: 5.0    # Minimum unrealised gain (%) on the open long for a pyramid add (#324)
  daily_loss_limit_pct: 3.0    # Pause engine if daily loss exceeds this
  max_drawdown_pct: 15.0       # Emergency stop if drawdown exceeds this
  cooldown_after_loss_min: 60  # Minutes to pause trading after a losing trade
  default_stop_loss_pct: 2.0
  default_take_profit_pct: 4.0
  signal_expiry_min: 120       # Discard pending signals older than this
  stale_price_move_pct: 2.0    # Cancel signal if price moved >X% since generation
  trailing_stop:               # Server-side trailing stop manager (#322)
    enabled: false             # Opt-in; disabled by default
    atr_multiple: 1.5          # new_stop = hwm - atr_multiple * ATR (absolute-price ATR)
    interval_sec: 60           # Recompute cadence
    atr_period: 14             # Wilder ATR lookback in 1h candles

# ── Analysis gate (cost-reduction Epics 1 & 2) ───────────────────────────────
# Controls the pre-LLM material-change gate (zero token cost) and the optional
# two-stage classifier and adaptive ensemble depth scorer.
analysis:
  material_change_only: true         # Skip LLM call if nothing significant changed
  hold_cooldown_min: 120             # Don't re-analyze a HOLD ticker for N minutes
  rsi_delta_threshold: 3.0          # Min RSI change to count as material
  ema_gap_delta_pct: 0.5            # Min EMA-gap change (%) to count as material
  price_move_threshold_pct: 0.75    # Min price move (%) to count as material
  news_novelty_enabled: true        # Treat new unseen news as always material
  max_news_articles_per_prompt: 5   # Cap news items injected into the LLM prompt
  max_candles_per_prompt: 20        # Cap OHLCV candles injected into the LLM prompt
  history_window_by_strategy:       # Per-strategy lookback (candles)
    trend_following: 20
    mean_reversion: 20
    momentum: 14

  # Classifier: two-stage gate that can block an analysis call before any
  # expensive model is invoked.
  # mode: disabled — always proceed to analysis
  #        shadow   — log what would have been skipped, but never block (safe for tuning)
  #        active   — enforce skips; llm_fallback_enabled adds a cheap LLM second opinion
  classifier:
    mode: shadow
    rsi_delta_threshold: 3.0
    ema_gap_delta_pct: 0.5
    price_move_threshold_pct: 0.75
    hold_cooldown_min: 120
    news_novelty_enabled: true
    llm_fallback_enabled: false      # If true, a SKIP from rules is confirmed by LLM
    llm_fallback_model: classifier   # Role name (from models.roles) for the LLM fallback — not a direct registry key

  # Specialist analysts (Issue #323, Grok 4.20 Alpha Arena lesson).
  # When enabled, the engine routes signal-generation calls to
  # Analyzer.AnalyzeSpecialist instead of AnalyzeFull. Four role-specialised
  # prompts (fundamental, technical, sentiment, risk_manager) run in parallel;
  # resolution is 3-of-4 majority + risk-manager veto, with a majority-vote
  # fallback when risk-manager is missing or failed. AnalyzeFull itself is
  # unchanged. DEFAULT OFF — opt in only after verifying provider keys for
  # every mapped role.
  specialist_mode_enabled: false
  # Map each specialist role to a key declared in models.registry above.
  # The mapping below is illustrative — operators should swap in whichever
  # provider+model they want behind each role. Any role whose mapped registry
  # key is missing or whose provider is unavailable is skipped at runtime
  # with a WARN log (no crash).
  specialist_roles:
    fundamental: analyst_frontier   # frontier model for catalysts/earnings reasoning
    technical: analyst_mid          # mid-tier for indicator/structure analysis
    sentiment: analyst_cheap        # cheap model for high-volume news/social pass
    risk_manager: analyst_frontier  # frontier model for portfolio/veto decisions

  # Adaptive depth: scores each tick and routes to fewer analysts when the
  # situation is low-volatility / low-novelty. Requires analyst tier roles
  # (analyst_cheap, analyst_mid, analyst_frontier) in models.registry.
  adaptive_depth:
    enabled: false                   # Opt-in; disable to always use all analysts
    low_threshold: 0.30              # Score < low → cheapest analyst only, no arbiter
    high_threshold: 0.65             # Score ≥ high → all analysts, standard rules
    weights:
      volatility: 0.30              # ATR% contribution
      news_novelty: 0.25            # News novelty contribution
      risk_proximity: 0.25          # Distance to stop/drawdown contribution
      trend_strength: 0.20          # ADX normalised contribution

# ── Cost profiles & budget guardrails (cost-reduction Epic 3) ────────────────
# profile sets a named preset for tick_interval, hold_cooldown, classifier mode,
# adaptive_depth, and cache TTL. Explicit values in this file always override the
# profile. Unknown profiles are rejected at startup.
#   budget   — 90-min ticks, classifier active, adaptive_depth off, 3h cache TTL
#   balanced — 60-min ticks, classifier active, adaptive_depth on, 2h cache TTL
#   pro      — 60-min ticks, classifier active, adaptive_depth on, 1h cache TTL
cost:
  profile: balanced
  daily_token_budget: 200000        # Auto-degrade profile if crossed (tokens/day)
  weekly_token_budget: 1200000      # Auto-degrade profile if crossed (tokens/week)
  auto_degrade_on_budget_hit: true  # Step down profile tier on budget breach
  # cache_ttl_min is owned by the cost profile (budget=180, balanced=120, pro=60).
  # Uncomment to override the profile-driven default with an explicit value.
  # cache_ttl_min: 120

notifications:
  telegram:
    enabled: false
    bot_token_env: TELEGRAM_BOT_TOKEN
    chat_id: ""                # Your Telegram chat ID
    notify_on:
      - signal
      - trade
      - error
      - daily_summary
    # Batching (Epic 1): accumulate events per tick and flush a single summary.
    # Error events always bypass the batcher and are sent immediately.
    batch_enabled: true
    batch_window_sec: 60          # Flush after N seconds of accumulation
    max_items_per_batch: 25       # Hard cap per flush
    include_holds: false          # Include HOLD signals in batch summary
    min_confidence_for_alert: 0.65  # Suppress signals below this confidence

logging:
  level: info                  # debug | info | warn | error
  format: text                 # text | json
  max_size_mb: 50              # rotate engine.log when it reaches this size
  max_backups: 7               # number of rotated log files to keep
  max_age_days: 30             # delete rotated log files older than this
  compress: true               # gzip rotated log files

database:
  url_env: DATABASE_URL        # export DATABASE_URL=postgres://...

reports:
  output_dir: ~/.tradeengine/reports
  auto_open_browser: true

backtest:
  initial_cash: 100000         # Starting virtual portfolio value for backtests
  risk_free_rate: 0.04         # Annual risk-free rate used for Sharpe/Sortino/Calmar

embeddings:
  enabled: false
  # Local-first setup (no embedding API usage): ollama + nomic-embed-text.
  # Note: nomic-embed-text is 768-dim, so if you enable this provider you must
  # use a 768-dim vector schema (or migrate from 1536 before enabling).
  provider: ollama             # ollama | openai
  dimension: 768               # Must match DB vector dimension
  model: nomic-embed-text      # Required when provider=ollama
  ollama_base_url: http://localhost:11434
  api_key_env: OPENAI_API_KEY  # Used only when provider=openai
  worker_interval_sec: 30
  batch_size: 50
  similar_analyses_enabled: false
  similar_analyses_threshold: 0.8
  similar_analyses_limit: 3

# ── ORB (Opening Range Breakout) mode ────────────────────────────────────────
# Phase 15: LLM-enhanced gap-and-go strategy. Run with `te run --mode orb`.
orb:
  enabled: false               # Set to true to enable ORB mode
  mode: paper                  # paper | live
  gap_threshold_pct: 3.0       # Minimum gap % to qualify as candidate
  max_candidates: 2            # Number of top candidates to trade (1–5)
  range_minutes: 15            # Opening range window: 5 or 15 minutes
  risk_reward: 2.0             # Risk/reward ratio for bracket orders (>= 1.5)
  max_risk_pct: 1.0            # Max risk per trade as % of portfolio (<= 5.0)
  news_lookback_hours: 24      # How far back to fetch news for catalyst scoring

