services:
  db:
    image: pgvector/pgvector:pg15
    container_name: tradeengine-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-tradeengine}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - tradeengine_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-tradeengine}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  tradeengine_pgdata:
